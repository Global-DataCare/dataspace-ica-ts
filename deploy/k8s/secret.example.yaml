apiVersion: v1
kind: Secret
metadata:
  name: ${K8S_SECRET_NAME}
type: Opaque
stringData:
  # Offline-issued ICA signing material. Never place the private key in the
  # ConfigMap or Root CA static bucket.
  # ICA_VC_SIGNING_PRIVATE_KEY_PEM: |-
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----
  # ICA_VC_SIGNING_CERTIFICATE_CHAIN_PEM: |-
  #   -----BEGIN CERTIFICATE-----
  #   ... ICA leaf ...
  #   -----END CERTIFICATE-----
  #   -----BEGIN CERTIFICATE-----
  #   ... issuing CA ...
  #   -----END CERTIFICATE-----
  #   -----BEGIN CERTIFICATE-----
  #   ... Root CA ...
  #   -----END CERTIFICATE-----

  # Optional FNMT pinning (recommended if ICA_FNMT_AUTO_DOWNLOAD=true)
  ICA_FNMT_ROOT_CERT_PIN_SHA1: ""
  ICA_FNMT_INTERMEDIATE_CERT_PINS_SHA1: ""

  # Optional inline trust mode (alternative to auto-download)
  # ICA_FNMT_ROOT_CERT_PEM: |-
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # ICA_FNMT_INTERMEDIATE_CERT_PEM: |-
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----

  # Optional GCS bucket when STORAGE_PROVIDER=gcs
  GCS_BUCKET_NAME: ""
