apiVersion: v1
kind: ConfigMap
metadata:
  name: ${K8S_CONFIGMAP_NAME}
data:
  ICA_API_HOST: "0.0.0.0"
  ICA_API_PORT: "3310"
  ICA_LOCAL_TENANT_ID: "ica"

  # Public Root trust identity/pin. Enable the required gate only after the
  # Secret contains the matching ICA private key and complete signed chain.
  # ICA_ROOT_CA_DID: "did:web:ca.example.org"
  # ICA_ROOT_CA_CERT_SHA256: "${ICA_ROOT_CA_CERT_SHA256}"
  # ICA_VC_SIGNING_X5U: "https://ica.example.org/.well-known/x509.pem"
  # ICA_VC_SIGNING_TRUST_REQUIRED: "true"

  ICA_SUPPORTED_JURISDICTIONS: "${ICA_SUPPORTED_JURISDICTIONS}"
  ICA_SUPPORTED_SECTORS: "${ICA_SUPPORTED_SECTORS}"

  ICA_VERIFY_STRICT_REVOCATION: "true"
  ICA_VERIFY_STRICT_TEMPLATE_MATCH: "true"
  ICA_VERIFY_TEMPLATE_MATCH_MODE: "logical-content"
  ICA_VERIFY_DIGEST_ALGORITHM: "sha3-384"
  VERIFIERS_VAT_LIST: "${VERIFIERS_VAT_LIST}"
  ICA_ALLOW_VERIFICATION_PARTNERS: "${ICA_ALLOW_VERIFICATION_PARTNERS}"
  VERIFICATION_PARTNERS_VAT_LIST: "${VERIFICATION_PARTNERS_VAT_LIST}"

  ICA_ALLOW_TEST_RESOURCE_TYPE_PREFIX: "false"
  ICA_TERMS_TEMPLATE_USE_TEST_PREFIX: "false"
  ICA_TERMS_TEMPLATE_CACHE_TTL_SECONDS: "900"
  ICA_TERMS_TEMPLATE_CACHE_MAX_ENTRIES: "64"
  ICA_TERMS_TEMPLATE_URL_PATTERN: "https://raw.githubusercontent.com/Global-DataCare/terms/refs/heads/main/dataspace/{sector}/{jurisdictionLower}/{resourceVersion}/terms.pdf"

  # Audit storage: mem|gcs|ipfs
  STORAGE_PROVIDER: "mem"
  ICA_AUDIT_STORAGE_REQUIRED: "true"
  ICA_AUDIT_ATTACHMENT_URL_PATTERN: "urn:uuid:{objectId}"
  ICA_AUDIT_STORAGE_GCS_PREFIX: "ica-audit"
  # IPFS_API_URL: "http://127.0.0.1:5001"
  # IPFS_GATEWAY_URL: "http://127.0.0.1:8080"
  # IPFS_MFS_ROOT: "/ica-audit"

  # Verification collections (issued credentials + evidence records)
  # Provider: mem|firestore|postgres
  DB_PROVIDER: "mem"
  ICA_COLLECTIONS_REQUIRED: "true"
  ICA_COLLECTIONS_PREFIX: "ica"
  # Optional when provider=firestore
  # FIRESTORE_PROJECT_ID: "your-gcp-project-id"
  # Optional when provider=postgres
  # POSTGRES_URL: "postgres://user:password@host:5432/database"

  # Optional automatic trust bootstrap from FNMT public URLs.
  ICA_FNMT_AUTO_DOWNLOAD: "true"
  ICA_FNMT_ROOT_CERT_URL: "https://www.sede.fnmt.gob.es/documents/10445900/10526749/AC_Raiz_FNMT-RCM_SHA256.cer"
  ICA_FNMT_INTERMEDIATE_CERT_URLS: "https://www.sede.fnmt.gob.es/documents/10445900/10526749/AC_Representacion.cer,https://www.sede.fnmt.gob.es/documents/10445900/10526749/AC_Sector_Publico.cer,https://www.sede.fnmt.gob.es/documents/10445900/10526749/AC_FNMT_Usuarios.cer"
